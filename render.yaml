# Render Blueprint — one-click deploy for the TDC Matchmaker OS API.
#
# In Render: New ▸ Blueprint ▸ connect this repo. Render reads this file from the
# repo root, builds the API, runs migrations, and seeds the demo data (200
# profiles + login) on every deploy.
#
# Uses an external Postgres (Neon / Supabase). Set these three secrets in the
# service's Environment tab (they are not synced from the blueprint):
#   • DATABASE_URL  — your Neon/Supabase connection string (include ?sslmode=require)
#   • GROQ_API_KEY  — free key from https://console.groq.com/keys (enables AI features)
#   • CLIENT_ORIGIN — your Vercel frontend URL, e.g. https://tdc-matchmaker.vercel.app

services:
  - type: web
    name: tdc-matchmaker-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev forces tsc/prisma/tsx to install even though NODE_ENV=production
    # (Render sets it), which npm would otherwise use to skip devDependencies.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # Set these three in the Render dashboard (not synced from the blueprint).
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
